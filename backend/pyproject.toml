[project]
name = "contractai-backend"
version = "0.1.0"
description = "ContractAI POC - Backend API"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy[asyncio]==2.0.25",
    "asyncpg==0.29.0",
    "aiosqlite==0.20.0",
    "pgvector==0.2.5",
    "alembic==1.13.1",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.6",
    "celery[redis]==5.3.6",
    "redis==5.0.1",
    "httpx==0.26.0",
    "openai==1.12.0",
    "google-auth==2.25.2",
    "google-auth-oauthlib==1.2.0",
    "google-auth-httplib2==0.2.0",
    "google-api-python-client==2.108.0",
    "msal==1.26.0",
    "requests-oauthlib==1.3.1",
    "pypdf==3.17.4",
    "python-docx==1.1.0",
    "python-magic==0.4.27",
    "tenacity==8.2.3",
    "structlog==24.1.0",
    "prometheus-client==0.19.0",
    "email-validator==2.1.0.post1",
    "pyjwt==2.8.0",
    "cryptography==42.0.5",
    "pyotp==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "httpx==0.26.0",
    "faker==22.0.0",
    "ruff==0.1.15",
    "mypy==1.7.1",
    "types-passlib==1.7.4.0",
    "types-redis==4.6.0.20240425",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "SIM", "T20", "ARG", "ERA", "PD", "PL", "TRY", "NPY", "RSE"]
ignore = ["S101", "PTH118", "PTH123"]
per-file-ignores = { "tests/*" = ["S101", "S106", "PTH118"] }

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]